<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Mapa de Competências — Liderança Logística</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --surface-alt:#F6F7F9;
    --ink-900:#10161D;
    --ink-800:#1B232C;
    --ink-700:#333F4B;
    --ink-500:#66727D;
    --ink-300:#98A2AC;
    --line:#DFE3E8;
    --line-soft:#EBEEF1;
    --accent:#146B63;
    --accent-dark:#0E4F49;
    --accent-soft:#DCEAE8;
    --gold:#8A6A1B;
    --l1:#B34A3C;   --l1-bg:#F7E4E1;
    --l2:#BD7E23;   --l2-bg:#F6E8D3;
    --l3:#3E6285;   --l3-bg:#E1E9F0;
    --l4:#146B63;   --l4-bg:#DCEAE8;
    --l5:#8A6A1B;   --l5-bg:#F0E6CC;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-card:0 1px 2px rgba(16,22,29,.04), 0 8px 24px -12px rgba(16,22,29,.12);
    --font-ui:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display:'Barlow Condensed', 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--ink-800);
    -webkit-font-smoothing:antialiased;
    font-size:14.5px;
    line-height:1.5;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- layout shell ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:246px;flex:none;background:var(--ink-900);color:#E7EBEE;
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{padding:4px 8px 22px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px;}
  .brand .mark{
    width:36px;height:36px;border-radius:9px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  }
  .brand .mark svg{width:20px;height:20px;stroke:#EAF4F2;}
  .brand h1{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.2px;margin:0 0 2px 0;line-height:1.15;color:#F4F6F7;}
  .brand p{margin:0;font-size:12px;color:#8E9BA6;}

  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;
    color:#B7C1CA;cursor:pointer;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%;
  }
  .nav-item svg{width:17px;height:17px;stroke:currentColor;flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{background:rgba(20,107,99,.35);color:#fff;}
  .nav-section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5E6B76;margin:18px 10px 6px 10px;font-weight:700;}

  .sidebar-foot{margin-top:auto;padding:14px 10px 4px 10px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#697680;line-height:1.5;}
  .sidebar-foot b{color:#9FADB8;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--surface);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .topbar h2{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0;color:var(--ink-900);flex:none;}
  .search-box{
    flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface-alt);
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  }
  .search-box svg{width:15px;height:15px;stroke:var(--ink-500);flex:none;}
  .search-box input{border:none;background:none;outline:none;width:100%;color:var(--ink-800);}
  .topbar-spacer{flex:1;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border-radius:9px;border:1px solid transparent;
    padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;stroke:currentColor;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--surface);color:var(--ink-700);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-300);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-danger-text{background:none;border:none;color:var(--l1);font-weight:700;cursor:pointer;font-size:12.5px;padding:4px 6px;}

  .content{padding:26px 28px 60px 28px;max-width:1360px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- generic pieces ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
  .section-title{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ink-900);margin:0 0 4px 0;}
  .section-sub{font-size:13px;color:var(--ink-500);margin:0 0 16px 0;max-width:640px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 18px;border-left:4px solid var(--accent);
  }
  .kpi.l1{border-left-color:var(--l1);}
  .kpi.l2{border-left-color:var(--l2);}
  .kpi.gold{border-left-color:var(--gold);}
  .kpi .kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);font-weight:700;margin-bottom:8px;}
  .kpi .kpi-value{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--ink-900);line-height:1;}
  .kpi .kpi-note{font-size:12px;color:var(--ink-500);margin-top:6px;}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}

  .pillar-bars{display:flex;flex-direction:column;gap:12px;}
  .pillar-bar-row{display:grid;grid-template-columns:170px 1fr 42px;align-items:center;gap:12px;}
  .pillar-bar-row .name{font-size:13px;font-weight:700;color:var(--ink-700);}
  .bar-track{height:9px;border-radius:5px;background:var(--surface-alt);border:1px solid var(--line-soft);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:var(--accent);}
  .pillar-bar-row .val{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-900);text-align:right;}

  .rank-list{display:flex;flex-direction:column;gap:0;}
  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row:hover .rank-name{color:var(--accent-dark);text-decoration:underline;}
  .rank-num{font-family:var(--font-display);font-size:15px;color:var(--ink-300);width:20px;flex:none;font-weight:600;}
  .avatar{
    border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--surface-alt);color:var(--ink-700);font-weight:700;overflow:hidden;border:1px solid var(--line);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .rank-row .avatar{width:34px;height:34px;font-size:12px;}
  .rank-meta{flex:1;min-width:0;}
  .rank-name{font-size:13.5px;font-weight:700;color:var(--ink-900);}
  .rank-role{font-size:12px;color:var(--ink-500);}
  .score-pill{
    font-family:var(--font-display);font-weight:600;font-size:15px;border-radius:7px;padding:3px 10px;flex:none;
  }

  .matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md);}
  table.matrix{border-collapse:collapse;width:100%;min-width:560px;}
  table.matrix th,table.matrix td{padding:10px 14px;text-align:center;font-size:13px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  table.matrix th{background:var(--surface-alt);color:var(--ink-700);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  table.matrix td:first-child,table.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;color:var(--ink-800);}
  table.matrix th:first-child{background:var(--surface-alt);}
  table.matrix tr:last-child td{border-bottom:none;}
  .cell-score{display:inline-flex;min-width:30px;justify-content:center;padding:3px 8px;border-radius:6px;font-weight:700;font-family:var(--font-display);font-size:14.5px;}

  /* ---------- employee grid ---------- */
  .filters-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .filters-row select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-700);font-weight:600;font-size:13px;}
  .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;}
  .emp-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;cursor:pointer;
    box-shadow:var(--shadow-card);transition:transform .12s ease, border-color .12s ease;
  }
  .emp-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .emp-card-top{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
  .emp-card .avatar{width:52px;height:52px;font-size:16px;}
  .emp-card-top .who{min-width:0;}
  .emp-card-top .who .nm{font-size:15px;font-weight:800;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .emp-card-top .who .rl{font-size:12.5px;color:var(--ink-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .emp-card-mid{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--surface-alt);color:var(--ink-700);border:1px solid var(--line);}
  .tag.status-Concluída{background:var(--l4-bg);color:var(--accent-dark);border-color:transparent;}
  .tag.status-Em-andamento{background:var(--l2-bg);color:var(--l2);border-color:transparent;}
  .tag.status-Pendente{background:var(--line-soft);color:var(--ink-500);border-color:transparent;}
  .emp-score-big{font-family:var(--font-display);font-size:28px;font-weight:600;}
  .emp-card-foot{font-size:12px;color:var(--ink-500);display:flex;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-500);}
  .empty-state svg{width:38px;height:38px;stroke:var(--ink-300);margin-bottom:10px;}

  /* ---------- detail view ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-500);font-weight:700;font-size:13px;cursor:pointer;margin-bottom:14px;border:none;background:none;padding:0;}
  .back-link svg{width:15px;height:15px;stroke:currentColor;}
  .back-link:hover{color:var(--ink-900);}

  .detail-header{padding:22px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px;}
  .photo-wrap{position:relative;flex:none;}
  .photo-wrap .avatar{width:92px;height:92px;font-size:28px;}
  .photo-edit-btn{
    position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:var(--ink-900);
    display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface);
  }
  .photo-edit-btn svg{width:13px;height:13px;stroke:#fff;}
  .detail-id{flex:1;min-width:240px;}
  .detail-id h3{font-family:var(--font-display);font-size:26px;margin:0 0 2px 0;color:var(--ink-900);font-weight:600;}
  .detail-id .role{font-size:14px;color:var(--ink-500);margin-bottom:12px;}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 20px;max-width:620px;}
  .meta-item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-300);font-weight:700;margin-bottom:2px;}
  .meta-item .v{font-size:13px;color:var(--ink-700);font-weight:700;}
  .meta-item select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-weight:700;font-size:12.5px;color:var(--ink-700);}
  .score-badge-lg{flex:none;text-align:center;padding:14px 20px;border-radius:var(--radius-md);min-width:130px;}
  .score-badge-lg .big{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1;}
  .score-badge-lg .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:4px;}
  .profile-chip{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:100px;background:var(--accent-soft);color:var(--accent-dark);}

  .radar-card{padding:20px;}
  .radar-card h4, .panel h4{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 12px 0;color:var(--ink-900);}
  .radar-box{max-width:380px;margin:0 auto;}

  .pillars-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0;}
  .pillar-panel{padding:16px 18px;}
  .pillar-panel-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .pillar-panel-head .ic{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none;}
  .pillar-panel-head .ic svg{width:14px;height:14px;stroke:var(--accent-dark);}
  .pillar-panel-head .tt{font-size:14px;font-weight:800;color:var(--ink-900);flex:1;}
  .pillar-panel-head .avg{font-family:var(--font-display);font-size:18px;font-weight:600;}
  .comp-row{display:grid;grid-template-columns:1fr 70px 40px;align-items:center;gap:10px;padding:6px 0;}
  .comp-row .cname{font-size:12.8px;color:var(--ink-700);}
  .comp-badge{
    font-family:var(--font-display);font-weight:600;font-size:14px;border-radius:6px;padding:2px 0;text-align:center;
    cursor:pointer;border:1px solid transparent;
  }
  .comp-badge:hover{filter:brightness(0.95);}

  .panel{padding:18px 20px;}
  .strength-gap-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .sg-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .sg-list li{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-alt);}
  .sg-list li span.n{font-weight:700;color:var(--ink-800);}
  .sg-tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;color:var(--ink-500);}

  .plan-table{width:100%;border-collapse:collapse;}
  .plan-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);font-weight:700;padding:0 10px 8px 10px;border-bottom:1px solid var(--line);}
  .plan-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  .plan-table input[type=text], .plan-table input[type=date], .plan-table select, .plan-table textarea{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--ink-800);
  }
  .plan-table textarea{resize:vertical;min-height:36px;}
  .plan-comp-name{font-size:12.5px;font-weight:800;color:var(--ink-900);}
  .plan-comp-level{font-size:11px;color:var(--ink-500);}
  .no-gaps{padding:22px;text-align:center;color:var(--ink-500);font-size:13px;background:var(--surface-alt);border-radius:10px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(16,22,29,.5);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{background:var(--surface);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
  .modal-box.wide{max-width:640px;}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal-head h3{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;color:var(--ink-900);}
  .modal-head p{font-size:12.5px;color:var(--ink-500);margin:4px 0 0 0;}
  .modal-close{border:none;background:var(--surface-alt);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .modal-close svg{width:14px;height:14px;stroke:var(--ink-700);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{font-size:12px;font-weight:700;color:var(--ink-700);}
  .form-field input, .form-field select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-800);background:var(--surface);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .photo-picker{display:flex;align-items:center;gap:14px;}

  .level-option{
    display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;border:1.5px solid var(--line);
    cursor:pointer;margin-bottom:8px;
  }
  .level-option:hover{border-color:var(--ink-300);}
  .level-option.selected{border-color:var(--accent);background:var(--accent-soft);}
  .level-num{
    font-family:var(--font-display);font-weight:600;font-size:20px;width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .level-txt .lt{font-size:13.5px;font-weight:800;color:var(--ink-900);margin-bottom:2px;}
  .level-txt .ld{font-size:12.5px;color:var(--ink-600,#4a5560);}

  .hint-banner{background:var(--surface-alt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-500);margin-bottom:16px;}

  @media (max-width: 980px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .pillars-grid{grid-template-columns:1fr;}
    .strength-gap-grid{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 760px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto;}
    .brand{border:none;padding:0;margin:0 14px 0 0;display:flex;flex-direction:row;align-items:center;gap:8px;}
    .brand .mark{margin-bottom:0;}
    .brand p{display:none;}
    .nav{flex-direction:row;}
    .nav-section-label{display:none;}
    .sidebar-foot{display:none;}
    .topbar{flex-wrap:wrap;padding:14px 16px;}
    .content{padding:18px 16px 50px 16px;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .detail-header{padding:16px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>
      </div>
      <h1>Mapa de Competências</h1>
      <p>Liderança Logística</p>
    </div>
    <div class="nav">
      <button class="nav-item" data-view="overview" onclick="navigate('overview')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"/><path d="M10 19V4"/><path d="M16 19v-7"/><path d="M4 19h16"/></svg>
        Visão geral
      </button>
      <button class="nav-item" data-view="employees" onclick="navigate('employees')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.7 20c0-3.5 2.8-6.3 6.3-6.3s6.3 2.8 6.3 6.3"/><circle cx="17.5" cy="8.7" r="2.4"/><path d="M15.8 13.9c2.7.5 4.7 2.8 4.7 5.6"/></svg>
        Colaboradores
      </button>

// Gera notas por competência a partir de uma média-alvo por pilar, com pequena
// variação determinística (mesma pessoa sempre gera os mesmos números).
function hashOffset(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*131 + seed.charCodeAt(i)) >>> 0;
  return (h % 3) - 1; // resulta em -1, 0 ou 1
}
function genScores(empId, pillarTargets, overrides={}){
  const out = {};
  PILLARS.forEach(p => {
    const target = pillarTargets[p.id];
    p.competencies.forEach(c => {
      let v = Math.round(target) + hashOffset(empId + '::' + c.id);
      v = Math.max(1, Math.min(5, v));
      out[c.id] = v;
    });
  });
  return Object.assign(out, overrides);
}

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1).replace('.', ','); }
const NAME_SUFFIXES = ['jr','jr.','junior','júnior','neto','filho','sobrinho','ii','iii'];
function meaningfulParts(name){
  const parts = name.trim().split(/\s+/).filter(w => !NAME_SUFFIXES.includes(w.toLowerCase().replace(/\.$/,'')));
  return parts.length ? parts : name.trim().split(/\s+/);
}
function initials(name){
  const parts = meaningfulParts(name);
  const a = parts[0] ? parts[0][0] : '';
  const b = parts.length>1 ? parts[parts.length-1][0] : '';
  return (a+b).toUpperCase();
}
// Rótulo curto para colunas estreitas (ex.: matriz da equipe). Usa só o primeiro
// nome, e acrescenta a inicial do sobrenome quando duas pessoas compartilham o
// mesmo primeiro nome (ex.: "Lucas S." e "Lucas F.").
function shortLabel(emp){
  const first = emp.name.trim().split(/\s+/)[0];
  const dupes = state.employees.filter(e => e.name.trim().split(/\s+/)[0] === first);
  if(dupes.length<=1) return first;
  const parts = meaningfulParts(emp.name);
  const lastInitial = parts.length>1 ? parts[parts.length-1][0].toUpperCase() : '';
  return lastInitial ? `${first} ${lastInitial}.` : first;
}
const AVATAR_HUES = ['#3E6285','#146B63','#8A6A1B','#B34A3C','#5B4B8A','#3D7A5A'];
function avatarColor(name){
  let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) % AVATAR_HUES.length;
  return AVATAR_HUES[h];
}
function avatarHtml(emp, size){
  if(emp.photo){
    return `<div class="avatar" style="width:${size}px;height:${size}px;"><img src="${emp.photo}" alt=""/></div>`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${avatarColor(emp.name)}22;color:${avatarColor(emp.name)};">${initials(emp.name)}</div>`;
}
function levelColorVar(score){
  return {1:'l1',2:'l2',3:'l3',4:'l4',5:'l5'}[score] || 'l3';
}

/* ---------- cálculos automáticos ---------- */

function compScore(emp, compId){ return emp.scoresByComp[compId] ?? 3; }

function pillarAverage(emp, pillarId){
  const pillar = PILLARS.find(p=>p.id===pillarId);
  const vals = pillar.competencies.map(c => compScore(emp, c.id));
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function overallScore(emp){
  const vals = ALL_COMPETENCIES.map(c => compScore(emp, c.id));
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function pillarAverages(emp){
  return PILLARS.map(p => ({ pillarId:p.id, name:p.name, short:p.short, avg: pillarAverage(emp,p.id) }));
}
function classifyProfile(emp){
  const avgs = pillarAverages(emp);
  const max = Math.max(...avgs.map(a=>a.avg));
  const min = Math.min(...avgs.map(a=>a.avg));
  if(max - min < 0.4) return BALANCED_PROFILE;
  const top = avgs.find(a=>a.avg===max);
  return PROFILE_MAP[top.pillarId];
}
function allCompScores(emp){
  return ALL_COMPETENCIES.map(c => ({...c, score: compScore(emp, c.id)}));
}
function strengths(emp, n=3){
  return [...allCompScores(emp)].sort((a,b)=>b.score-a.score).slice(0,n);
}
function gaps(emp){
  return allCompScores(emp).filter(c=>c.score<3).sort((a,b)=>a.score-b.score);
}
function countBelow3(emp){ return allCompScores(emp).filter(c=>c.score<3).length; }
function countAdvanced(emp){ return allCompScores(emp).filter(c=>c.score>=4).length; }
function developmentPriorityPillar(emp){
  const avgs = pillarAverages(emp);
  return avgs.reduce((min,a)=> a.avg<min.avg? a : min, avgs[0]);
}

function ensureAutoPlanEntries(emp){
  const gapList = gaps(emp);
  gapList.forEach(g => {
    const exists = emp.plan.some(p => p.competencyId === g.id);
    if(!exists){
      emp.plan.push({
        id:'plan-'+(planIdSeq++), competencyId:g.id, action: suggestedAction(g.id, g.name),
        responsible:'', deadline:'', status:'Não iniciado', observation:'', auto:true,
      });
    }
  });
}

  state.view = view;

  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view===view || (view==='detail' && b.dataset.view==='employees')));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  renderTopbar();
  if(view==='overview') renderOverview();
  if(view==='employees') renderEmployeeGrid();
  if(view==='detail') renderDetail(state.currentId);
  window.scrollTo({top:0,behavior:'instant'});
}

function setSearch(v){ state.search = v; renderEmployeeGrid(false); }
function setFilter(kind, v){ if(kind==='area') state.filterArea=v; else state.filterStatus=v; renderEmployeeGrid(); }

function renderEmployeeGrid(rebuildFilters=true){
  if(rebuildFilters){
    const areaSel = document.getElementById('filter-area');
    const areas = Array.from(new Set(state.employees.map(e=>e.area)));
    areaSel.innerHTML = `<option value="todas">Todas as áreas</option>` + areas.map(a=>`<option value="${esc(a)}" ${state.filterArea===a?'selected':''}>${esc(a)}</option>`).join('');
    document.getElementById('filter-status').value = state.filterStatus;
  }
  const grid = document.getElementById('emp-grid');
  const q = state.search.trim().toLowerCase();
  const list = state.employees.filter(e => {
    const matchQ = !q || e.name.toLowerCase().includes(q) || e.cargo.toLowerCase().includes(q);
    const matchArea = state.filterArea==='todas' || e.area===state.filterArea;
    const matchStatus = state.filterStatus==='todos' || e.status===state.filterStatus;
    return matchQ && matchArea && matchStatus;
  });

  if(list.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <div>Nenhum colaborador encontrado com esses filtros.</div>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(e => {
    const sc = overallScore(e); const cv = levelColorVar(Math.round(sc));
    const prof = classifyProfile(e);
    const statusClass = e.status.replace(/\s+/g,'-');
    return `
    <div class="emp-card" onclick="navigate('detail','${e.id}')">
      <div class="emp-card-top">
        ${avatarHtml(e,52)}
        <div class="who">
          <div class="nm">${esc(e.name)}</div>
          <div class="rl">${esc(e.cargo)}</div>
        </div>
      </div>
      <div class="emp-card-mid">
        <span class="tag status-${statusClass}">${esc(e.status)}</span>
        <span class="emp-score-big" style="color:var(--${cv});">${fmt1(sc)}</span>
      </div>
      <div class="tag" style="margin-bottom:12px;">${esc(prof.name)}</div>
      <div class="emp-card-foot">
        <span>${esc(e.area)}</span>
        <span>${countBelow3(e)} gap(s)</span>
      </div>
    </div>`;
  }).join('');
}

function formatDateBR(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function drawRadar(emp, pAvgs){
  const ctx = document.getElementById('radar-canvas');
  if(!ctx || typeof Chart==='undefined') return;
  if(radarChart) radarChart.destroy();
  radarChart = new Chart(ctx, {
    type:'radar',
    data:{
      labels: pAvgs.map(p=>p.short),
      datasets:[{
        label:'Nível médio',
        data: pAvgs.map(p=>p.avg),
        backgroundColor:'rgba(20,107,99,0.16)',
        borderColor:'#146B63',
        borderWidth:2,
        pointBackgroundColor:'#146B63',
        pointRadius:3,
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      scales:{ r:{ min:0, max:5, ticks:{ stepSize:1, backdropColor:'transparent', color:'#98A2AC', font:{size:10} }, grid:{color:'#DFE3E8'}, angleLines:{color:'#DFE3E8'}, pointLabels:{ color:'#333F4B', font:{ family:'Manrope', size:11, weight:'700' } } } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => 'Nível médio: ' + fmt1(c.parsed.r) } } }
    }
  });
}

let pendingPhotoTarget = null; // 'new' or employee id

function triggerPhotoUpload(empId){
  pendingPhotoTarget = empId;
  document.getElementById('hidden-photo-input').click();
}
function handlePhotoFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    if(pendingPhotoTarget==='new-employee-form'){
      window.__newEmployeePhoto = e.target.result;
      const prev = document.getElementById('new-emp-photo-preview');
      if(prev) prev.innerHTML = `<img src="${e.target.result}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
      const emp = state.employees.find(x=>x.id===pendingPhotoTarget);
      if(emp){ emp.photo = e.target.result; renderDetail(emp.id); }
    }
  };
  reader.readAsDataURL(file);
  evt.target.value = '';
}

function updateEmployeeField(empId, field, value){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  emp[field] = value;
  if(state.view==='detail') renderDetail(empId);
}

function setScore(empId, compId, level){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  emp.scoresByComp[compId] = level;
  closeModal();
  renderDetail(empId);
  if(state.view==='employees') renderEmployeeGrid();
}

function updatePlanField(empId, planId, field, value){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  const entry = emp.plan.find(p=>p.id===planId);
  if(entry){ entry[field]=value; entry.auto=false; }
}
function removePlanEntry(empId, planId){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  emp.plan = emp.plan.filter(p=>p.id!==planId);
  renderDetail(empId);
}

        <div class="form-field"><label>Área</label><input type="text" id="f-area" placeholder="Ex.: Armazenagem"></div>
        <div class="form-field"><label>Avaliador</label><input type="text" id="f-avaliador" placeholder="Ex.: Diretoria de Operações"></div>
        <div class="form-field"><label>Data da avaliação</label><input type="date" id="f-data" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="form-field"><label>Tempo na função</label><input type="text" id="f-tempo" placeholder="Ex.: 2 anos"></div>
        <div class="form-field"><label>Status da avaliação</label>
          <select id="f-status"><option>Em andamento</option><option>Concluída</option><option>Pendente</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitNewEmployee()">Cadastrar colaborador</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

function submitNewEmployee(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('Informe o nome do colaborador.'); return; }
  const baseScores = {};
  ALL_COMPETENCIES.forEach(c => baseScores[c.id] = 3);
  const emp = {
    id:'emp-'+Date.now(),
    name,
    cargo: document.getElementById('f-cargo').value.trim() || 'Não informado',
    area: document.getElementById('f-area').value.trim() || 'Não informado',
    avaliador: document.getElementById('f-avaliador').value.trim() || 'Não informado',
    dataAvaliacao: document.getElementById('f-data').value,
    tempoFuncao: document.getElementById('f-tempo').value.trim() || 'Não informado',
    status: document.getElementById('f-status').value,
    photo: window.__newEmployeePhoto || null,
    scoresByComp: baseScores,
    plan: [],
  };
  state.employees.push(emp);
  closeModal();
  navigate('detail', emp.id);
}

function openEditEmployeeModal(empId){
  const emp = state.employees.find(e=>e.id===empId);
  const html = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <div><h3>Editar dados</h3><p>Atualize as informações cadastrais de ${esc(emp.name)}.</p></div>
        <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="form-grid">
        <div class="form-field full"><label>Nome completo</label><input type="text" id="ef-name" value="${esc(emp.name)}"></div>
        <div class="form-field"><label>Cargo</label><input type="text" id="ef-cargo" value="${esc(emp.cargo)}"></div>
        <div class="form-field"><label>Área</label><input type="text" id="ef-area" value="${esc(emp.area)}"></div>
        <div class="form-field"><label>Avaliador</label><input type="text" id="ef-avaliador" value="${esc(emp.avaliador)}"></div>
        <div class="form-field"><label>Data da avaliação</label><input type="date" id="ef-data" value="${esc(emp.dataAvaliacao)}"></div>
        <div class="form-field"><label>Tempo na função</label><input type="text" id="ef-tempo" value="${esc(emp.tempoFuncao)}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitEditEmployee('${empId}')">Salvar alterações</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function submitEditEmployee(empId){
  const emp = state.employees.find(e=>e.id===empId);
  emp.name = document.getElementById('ef-name').value.trim() || emp.name;
  emp.cargo = document.getElementById('ef-cargo').value.trim();
  emp.area = document.getElementById('ef-area').value.trim();
  emp.avaliador = document.getElementById('ef-avaliador').value.trim();
  emp.dataAvaliacao = document.getElementById('ef-data').value;
  emp.tempoFuncao = document.getElementById('ef-tempo').value.trim();
  closeModal();
  renderDetail(empId);
}

function openAddPlanModal(empId){
  const emp = state.employees.find(e=>e.id===empId);
  const options = ALL_COMPETENCIES.map(c=>`<option value="${c.id}">${esc(c.name)} (nível atual: ${compScore(emp,c.id)})</option>`).join('');
  const html = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box wide">
      <div class="modal-head">
        <div><h3>Adicionar ação de desenvolvimento</h3><p>Vincule uma ação a qualquer competência de ${esc(emp.name)}.</p></div>
        <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="form-grid">
        <div class="form-field full"><label>Competência</label><select id="pf-comp">${options}</select></div>
        <div class="form-field full"><label>Ação de desenvolvimento</label><input type="text" id="pf-action" placeholder="Ex.: Treinamento em..."></div>
        <div class="form-field"><label>Responsável</label><input type="text" id="pf-resp" placeholder="Nome do responsável"></div>
        <div class="form-field"><label>Prazo</label><input type="date" id="pf-deadline"></div>
        <div class="form-field"><label>Status</label><select id="pf-status"><option>Não iniciado</option><option>Em andamento</option><option>Concluído</option></select></div>
        <div class="form-field"><label>Observação</label><input type="text" id="pf-obs" placeholder="Opcional"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitAddPlan('${empId}')">Adicionar ao plano</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function submitAddPlan(empId){
  const emp = state.employees.find(e=>e.id===empId);
  const compId = document.getElementById('pf-comp').value;
  const action = document.getElementById('pf-action').value.trim() || suggestedAction(compId, ALL_COMPETENCIES.find(c=>c.id===compId).name);
  emp.plan.push({
    id:'plan-'+(planIdSeq++), competencyId:compId, action,
    responsible: document.getElementById('pf-resp').value.trim(),
    deadline: document.getElementById('pf-deadline').value,
    status: document.getElementById('pf-status').value,
    observation: document.getElementById('pf-obs').value.trim(),
    auto:false,
  });
  closeModal();
  renderDetail(empId);
}

/* =====================================================================

   ===================================================================== */
navigate('overview');
</script>
